<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Rinten</title>
	<script type="importmap"></script>
	<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
}
body {
	color: #e8e8e8;
	background: #101114;
	touch-action: none;
	font-family: system-ui, sans-serif;
}
#canvas {
	display: block;
	width: 100%;
	height: 100%;
	outline: none;
}
#loading {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	background: #101114;
	pointer-events: none;
}
#status {
	max-width: 80%;
	text-align: center;
	white-space: pre-wrap;
	font-size: 14px;
	opacity: 0.85;
}
#bar {
	width: min(320px, 60%);
	height: 4px;
	border-radius: 2px;
	background: #24262c;
	overflow: hidden;
}
#bar > div {
	height: 100%;
	width: 0;
	background: #6ea8fe;
	transition: width 0.1s linear;
}
#fullscreen {
	position: absolute;
	right: 12px;
	bottom: 12px;
	width: 34px;
	height: 34px;
	display: none;
	align-items: center;
	justify-content: center;
	padding: 0;
	border: 1px solid #ffffff24;
	border-radius: 8px;
	background: #00000059;
	color: #e8e8e8;
	font-size: 16px;
	line-height: 1;
	cursor: pointer;
	touch-action: manipulation;
	opacity: 0.35;
	transition: opacity 0.15s linear, background 0.15s linear;
}
#fullscreen:hover, #fullscreen:focus-visible {
	opacity: 1;
	background: #000000a6;
	outline: none;
}
@media (pointer: coarse) {
	/* A finger is not a mouse: bigger, and never faded to something nobody can find. */
	#fullscreen { width: 44px; height: 44px; opacity: 0.6; font-size: 19px; }
}
#entervr {
	position: absolute;
	right: 12px;
	bottom: 56px;
	display: none;
	align-items: center;
	justify-content: center;
	gap: 8px;
	padding: 10px 16px;
	border: 1px solid #ffffff2e;
	border-radius: 8px;
	background: #00000073;
	color: #e8e8e8;
	font: 600 14px/1 system-ui, sans-serif;
	letter-spacing: 0.04em;
	cursor: pointer;
	touch-action: manipulation;
	opacity: 0.75;
	transition: opacity 0.15s linear, background 0.15s linear;
}
#entervr:hover, #entervr:focus-visible {
	opacity: 1;
	background: #000000b3;
	outline: none;
}
@media (pointer: coarse) {
	#entervr { padding: 14px 20px; font-size: 16px; opacity: 0.9; }
}
#error {
	position: absolute;
	inset: auto 0 0 0;
	display: none;
	padding: 12px 16px;
	background: #2a1416;
	border-top: 1px solid #6b2b30;
	color: #ffb4b4;
	font: 12px/1.5 ui-monospace, monospace;
	white-space: pre-wrap;
	max-height: 40%;
	overflow: auto;
}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0"></canvas>
	<div id="loading">
		<div id="status">Starting…</div>
		<div id="bar"><div></div></div>
	</div>
	<button id="fullscreen" type="button" title="Full screen" aria-label="Full screen">&#9974;</button>
	<button id="entervr" type="button" title="Play in VR" aria-label="Play in VR">ENTER VR</button>
	<div id="error"></div>
	<script>
globalThis.dotnetStarted = true;

var loadingEl = document.getElementById("loading");
var statusEl = document.getElementById("status");
var barEl = document.querySelector("#bar > div");
var errorEl = document.getElementById("error");

function say(text) {
	if (!statusEl) return;
	if (!text) { loadingEl.style.display = "none"; return; }
	loadingEl.style.display = "flex";
	statusEl.innerText = text;
}

function progress(done, total) {
	if (!barEl) return;
	barEl.style.width = total > 0 ? (Math.min(done / total, 1) * 100) + "%" : "0";
}

function fail(text) {
	if (!errorEl) return;
	errorEl.style.display = "block";
	errorEl.textContent += (errorEl.textContent ? "\n" : "") + text;
}

globalThis.rintenSay = say;
globalThis.rintenProgress = progress;

// Full screen, without the game having to offer it.
//
// A browser will only go full screen from a gesture, so every game on a page
// needs a button somewhere; a game that has one of its own calls the engine
// (Application.RenderSettings.Fullscreen) and this one is the fallback for every
// game that has not. Out of the way at a third opacity, gone while the game holds
// the pointer, and gone while it is full screen - escape is how a browser comes
// back and it says so itself.
var fullscreenEl = document.getElementById("fullscreen");

function fullscreenOn() {
	return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function showFullscreenButton() {
	if (!fullscreenEl) return;

	var native = globalThis.RintenNative;
	var allowed = native && native.fullscreenAllowed ? native.fullscreenAllowed() : 0;
	var locked = document.pointerLockElement != null;

	fullscreenEl.style.display = allowed && !fullscreenOn() && !locked ? "flex" : "none";
}

if (fullscreenEl) {
	fullscreenEl.addEventListener("click", function (e) {
		e.preventDefault();
		var native = globalThis.RintenNative;
		if (native && native.setFullscreen) native.setFullscreen(1);
		var canvas = document.getElementById("canvas");
		if (canvas) canvas.focus();
	});

	document.addEventListener("fullscreenchange", showFullscreenButton);
	document.addEventListener("webkitfullscreenchange", showFullscreenButton);
	document.addEventListener("pointerlockchange", showFullscreenButton);
}

// Whether this build asks for a headset, settled before the graphics context is
// made - a context a headset draws from has to say so when it is created, and
// nothing can say it afterwards. The build's manifest says, and the address may
// say instead: ?vr for a build that did not ask, ?novr for one that did.
globalThis.RintenWantsXr = false;

// The build's manifest, read once: whether it wants a headset, and the hash its
// module is kept under - see moduleResponse.
var manifest = null;

async function readManifest() {
	try {
		var answer = await fetch("web-game.json", { cache: "no-cache" });
		if (answer.ok) manifest = await answer.json();
	} catch (e) {
		manifest = null;
	}
}

function wantsHeadset() {
	var query = new URLSearchParams(location.search);
	if (query.has("novr")) return false;
	if (query.has("vr")) return true;

	return !!(manifest && (manifest.Vr || manifest.vr));
}

// Whether this browser opens a stream packed so.
function opens(format) {
	try {
		new DecompressionStream(format);
		return true;
	} catch (e) {
		return false;
	}
}

//The module, smallest first: brotli and gzip copies sit beside it, since itch.io or GitHub Pages
//may not compress on the fly. Unpacked whole and checked, so a host that mangles one falls to the next
async function packedModule(url) {
	var tries = [];
	if (opens("brotli")) tries.push([".br", "brotli"]);
	if (opens("gzip")) tries.push([".gz", "gzip"]);
	tries.push(["", null]);

	var why = "";

	for (var i = 0; i < tries.length; i++) {
		try {
			var answer = await fetch(url + tries[i][0], { cache: "no-cache" });
			if (!answer.ok) { why = url + tries[i][0] + ": " + answer.status; continue; }

			//itch.io unpacks an uploaded .br and serves it gzipped on the fly, unsized: 100 MB that breaks off near the end
			var encoded = (answer.headers.get("Content-Encoding") || "").toLowerCase();
			if (tries[i][1] === "brotli" && encoded && encoded !== "br") {
				why = url + tries[i][0] + ": re-encoded as " + encoded;
				answer.body && answer.body.cancel();
				continue;
			}

			//Open already where the host sent it with Content-Encoding, whatever the header says
			var bytes = new Uint8Array(await answer.arrayBuffer());
			if (!isWasm(bytes) && tries[i][1]) bytes = await unpack(bytes, tries[i][1]);
			if (!isWasm(bytes)) { why = url + tries[i][0] + ": not a module"; continue; }

			return new Response(bytes, { headers: { "Content-Type": "application/wasm" } });
		} catch (e) {
			why = url + tries[i][0] + ": " + (e && e.message ? e.message : e);
			console.warn(why);
		}
	}

	throw new Error("The game's module did not load (" + why + ")");
}

function isWasm(bytes) {
	return bytes.length > 8 && bytes[0] === 0 && bytes[1] === 0x61 && bytes[2] === 0x73 && bytes[3] === 0x6d;
}

async function unpack(bytes, format) {
	var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
	return new Uint8Array(await new Response(stream).arrayBuffer());
}

//A start that failed on a download the network cut off - it changed under the page, as a phone's does
//between networks - rather than on the game
function cutOff(why) {
	return /failed to fetch|network/i.test(why);
}

//The page loaded anew, twice at most a visit: a module that failed to load stays failed in this page
function loadAgain() {
	try {
		var tries = Number(sessionStorage.getItem("rinten.retries") || 0);
		if (tries >= 2) return false;
		sessionStorage.setItem("rinten.retries", String(tries + 1));
	} catch (e) {
		return false;
	}

	say("Connection dropped - loading again…");
	setTimeout(function () { location.reload(); }, 1000);
	return true;
}

function forgetRetries() {
	try { sessionStorage.removeItem("rinten.retries"); } catch (e) { }
}

//The module out of the browser's cache under the export's hash, which Chrome compiles from its own code
//cache; a new export is a new hash and the old copy goes. No cache off https/localhost: every visit downloads
async function moduleResponse(url) {
	var hash = manifest && manifest.Module;
	var store = null;

	try {
		if (hash && globalThis.caches) store = await caches.open("rinten-module");
	} catch (e) {
		store = null;
	}

	var key = hash ? new URL(url + "?" + hash, location.href).href : null;

	if (store) {
		try {
			var kept = await store.match(key);
			if (kept) return kept;
		} catch (e) {
		}
	}

	var answer = await packedModule(url);

	if (store && answer.ok) {
		try {
			await store.put(key, answer.clone());

			var old = await store.keys();
			for (var i = 0; i < old.length; i++) if (old[i].url !== key) await store.delete(old[i]);
		} catch (e) {
		}
	}

	return answer;
}

// The way into a headset, for a game that draws none of its own - the same
// bargain the full-screen button makes, and for the same reason: only a gesture
// may open a session.
var vrEl = document.getElementById("entervr");
var vrOffered = false;

function showVrButton() {
	if (!vrEl) return;

	var xr = globalThis.RintenXr;
	var can = xr && xr.supported ? xr.supported() : 0;
	var inside = xr && xr.active ? xr.active() : 0;

	vrEl.style.display = vrOffered && can === 1 && !inside ? "flex" : "none";

	// Below nought is "the browser has not answered yet" - it answers through a
	// promise, and saying no now would be believed for the rest of the run.
	if (vrOffered && can < 0) setTimeout(showVrButton, 250);
}

globalThis.rintenOfferVr = function (state) {
	vrOffered = !!state;
	showVrButton();
};

globalThis.rintenVrChanged = showVrButton;

if (vrEl) {
	vrEl.addEventListener("click", function (e) {
		e.preventDefault();
		var xr = globalThis.RintenXr;
		if (xr && xr.enter) xr.enter();
		setTimeout(showVrButton, 100);
		var canvas = document.getElementById("canvas");
		if (canvas) canvas.focus();
	});
}

function load(src) {
	return new Promise(function (resolve, reject) {
		var tag = document.createElement("script");
		tag.src = src;
		tag.onload = resolve;
		tag.onerror = function () { reject(new Error(src + " did not load")); };
		document.body.appendChild(tag);
	});
}

// Which of the two tables the engine draws through - see webgl2.js. WebGPU
// where the browser has it and it opens, WebGL2 where it has not or will not -
// and ?webgpu or ?webgl on the address to ask for one. Bound as the one name the
// engine calls, RintenRender: its first call is init, which settles which, and
// every call after it is the chosen table's own function.
function chooseRenderer() {
	var backends = globalThis.RintenBackends;
	var query = new URLSearchParams(location.search);
	// A build that wants a headset gets WebGL2 whatever else is here: drawing to
	// one from WebGPU needs XRGPUBinding, which no headset's browser has - see
	// webgpu.js, which says so itself.
	var order = query.has("webgl") ? [backends.webgl2]
		: query.has("webgpu") ? [backends.webgpu]
		: globalThis.RintenWantsXr ? [backends.webgl2]
		: navigator.gpu && !webgpuBroke() ? [backends.webgpu, backends.webgl2]
		: [backends.webgl2];

	var chosen = {};

	function take(table) {
		for (var name in table) if (name !== "init") chosen[name] = table[name];
	}

	chosen.init = async function (validation) {
		for (var table of order) {
			if (await table.init(validation)) {
				take(table);
				// Asked for by name, it stays whatever happens: that is a test of it.
				if (table === backends.webgpu && !query.has("webgpu")) watchWebgpu(table);
				return 1;
			}
		}
		// None opened: the last one says why.
		take(order[order.length - 1]);
		return 0;
	};

	globalThis.RintenRender = chosen;
}

// What a WebGPU that failed this build is remembered under: the module's hash, so
// the next build - which may well have fixed it - is given its chance again.
function webgpuBrokeKey() {
	return "rinten.webgpu.broke." + (manifest && manifest.Module ? manifest.Module : "");
}

function webgpuBroke() {
	try { return !!localStorage.getItem(webgpuBrokeKey()); } catch (e) { return false; }
}

// A device lost, or a pipeline it would not build - a driver's compiler refusing
// what another's took - and the game is opened again on WebGL2, and stays there
// for this build. Watched over the first minute, which is when they all build.
function watchWebgpu(table) {
	var started = Date.now();
	var timer = setInterval(function () {
		var why = table.broken ? table.broken() : "";
		if (!why) {
			if (Date.now() - started > 60000) clearInterval(timer);
			return;
		}
		clearInterval(timer);
		console.error("WebGPU cannot draw this game here (" + why + ") - opening it on WebGL2");
		try {
			localStorage.setItem(webgpuBrokeKey(), why);
			location.reload();
		} catch (e) {
			// Nowhere to remember it - a private window - so the address says it instead.
			var again = new URL(location.href);
			again.searchParams.set("webgl", "");
			location.replace(again);
		}
	}, 1000);
}

(async function () {
	try {
		// Page-side scripts and no native module: native.js is the canvas, the
		// input and the downloads; webgpu.js and webgl2.js are the two handle
		// tables the engine's own WebGPU backend can draw through.
		await load("native.js");
		await load("webgpu.js");
		await load("webgl2.js");
		await load("webxr.js");
		await load("basis.js");

		// Before the renderer, because it decides which renderer, and before the
		// context, because the context has to be made able to draw to a headset.
		await readManifest();
		globalThis.RintenWantsXr = wantsHeadset();

		globalThis.RintenNative = RintenNativeBind({ canvas: document.getElementById("canvas") });
		chooseRenderer();
		globalThis.RintenXr = RintenXrBind();
		showFullscreenButton();
		showVrButton();

		say("Loading .NET…");
		const { dotnet } = await import("./_framework/dotnet.js");

		// A threaded runtime puts .NET on a worker of its own and, by default,
		// refuses to let the page call into it synchronously at all
		// ("Cannot call synchronous C# methods"). That is exactly what a headset
		// needs: the session's animation callback has to run the engine's frame
		// while it is still running, because the poses and the layer are good
		// only there and not one microtask later - see webxr.js.
		//
		// So the blocking mode is relaxed to the one that allows it and says so.
		// Nothing the engine forks calls back into the page, so a frame that
		// waits for its workers cannot be waiting on the thread it is blocking.
		// Harmless without threads: the setting has no meaning there.
		if (dotnet.withConfig) dotnet.withConfig({ jsThreadBlockingMode: "WarnWhenBlockingWait" });

		// The interpreter compiles a method plainly first and again, optimised,
		// once it has been called enough - and a game's hot methods all get there
		// together, twenty-odd seconds into play: one frame of two hundred
		// milliseconds, every time, which in a headset is a lurch. With this the
		// page keeps the list of methods that were optimised and, on every visit
		// after the first, optimises them on their first call instead - while the
		// game loads. Saved forty seconds in, so the list includes that burst.
		if (dotnet.withInterpreterPgo) dotnet.withInterpreterPgo(true, 40);

		// The module carries no boot list naming its program, as Mono's did.
		dotnet.withMainAssembly("Rinten-Web");

		// The module itself the page's own way - packed, and kept - see moduleResponse.
		if (dotnet.withResourceLoader) {
			dotnet.withResourceLoader(function (type, name, url) {
				return type === "dotnetwasm" ? moduleResponse(url) : url;
			});
		}

		const runtime = await dotnet.create();
		say("Starting engine…");
		forgetRetries();

		// Anything on the address that begins with a dash is handed to the engine
		// as a command-line switch, so ?-perfreport=8 is -perfreport 8. A browser
		// has no command line and every diagnostic the engine has is behind one:
		// without this, none of them can be reached from a page at all.
		const switches = [];

		new URLSearchParams(location.search).forEach(function (value, key) {
			if (key.charAt(0) !== "-") return;
			switches.push(key);
			if (value !== "") switches.push(value);
		});

		await runtime.runMain(undefined, switches);
	} catch (e) {
		console.error(e);
		var why = String(e && e.message ? e.message : e);
		if (cutOff(why) && loadAgain()) return;
		say("");
		fail(why);
	}
})();
	</script>
</body>
</html>
